{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400&display=swap" rel="stylesheet">

    <!-- Estilos del login-form-07 -->
    <link rel="stylesheet" href="{% static 'login-form-07/fonts/icomoon/style.css' %}">
    <link rel="stylesheet" href="{% static 'login-form-07/css/owl.carousel.min.css' %}">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'login-form-07/css/bootstrap.min.css' %}">
    <!-- Style -->
    <link rel="stylesheet" href="{% static 'login-form-07/css/style.css' %}">

    <title>Login -  Farmacia Nelly</title>
  </head>
  <body>
  

  
  <div class="content">
    <div class="container">
      <div class="row">
        <div class="col-md-6">
          <img src="{% static 'login-form-07/images/undraw_remotely_2j6y.svg' %}" alt="Image" class="img-fluid">
        </div>
        <div class="col-md-6 contents">
          <div class="row justify-content-center">
            <div class="col-md-8">
              <div class="mb-4">
              <h3>Iniciar Sesión</h3>
              <p class="mb-4">Ingrese sus credenciales para continuar.</p>
            </div>
            <!-- Formulario adaptado a Django -->
              <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="form-group first">
                  <label for="Correo_Empleados">Usuario</label>
                  <input type="email" class="form-control" name="Correo_Empleados" id="Correo_Empleados" required>
                </div>
                <div class="form-group last mb-4">
                  <label for="Pass">Contraseña</label>
                  <input type="password" class="form-control" name="Pass" id="Pass" required>
                </div>
                <button type="submit" class="btn btn-block btn-primary">Ingresar</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

    <!-- Scripts del login-form-07 -->
    <script src="{% static 'login-form-07/js/jquery-3.3.1.min.js' %}"></script>
    <script src="{% static 'login-form-07/js/popper.min.js' %}"></script>
    <script src="{% static 'login-form-07/js/bootstrap.min.js' %}"></script>
    <script src="{% static 'login-form-07/js/main.js' %}"></script>
  </body>
</html>
